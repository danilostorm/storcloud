name: Web CI

on:
  push:
    branches: [main, pixel-plates-release]
    paths:
      - 'frontend/**'
      - 'update.sh'
      - '.github/workflows/web-ci.yml'
  pull_request:
    paths:
      - 'frontend/**'
      - 'update.sh'
      - '.github/workflows/web-ci.yml'

jobs:
  web-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Validate approved pixel plates
        run: |
          set -euo pipefail
          for f in home catalog library retro pc achievements account admin; do
            test -s "frontend/assets/mockups/${f}.jpg"
            test "$(stat -c%s "frontend/assets/mockups/${f}.jpg")" -gt 1000
            file "frontend/assets/mockups/${f}.jpg"
          done

      - name: Validate Nginx configuration
        run: |
          docker run --rm -v "$PWD/frontend/nginx.conf:/etc/nginx/conf.d/default.conf:ro" nginx:1.27-alpine nginx -t

      - name: Validate pixel UI files
        run: |
          test -s frontend/assets/pixel.css
          test -s frontend/assets/plate-runtime.css
          node --check frontend/assets/pixel.js
          python3 - <<'PY'
          from pathlib import Path
          pages = {
              Path('frontend/index.html'): 'home',
              Path('frontend/catalog/index.html'): 'catalog',
              Path('frontend/library/index.html'): 'library',
              Path('frontend/retro/index.html'): 'retro',
              Path('frontend/pc/index.html'): 'pc',
              Path('frontend/achievements/index.html'): 'achievements',
              Path('frontend/account/index.html'): 'account',
              Path('frontend/admin/index.html'): 'admin',
          }
          for page, name in pages.items():
              html = page.read_text(encoding='utf-8')
              assert '/assets/pixel.css' in html, page
              assert '/assets/plate-runtime.css' in html, page
              assert '/assets/pixel.js' in html, page
              assert f'data-page="{name}"' in html, page
              assert 'id="live"' in html, page
              assert 'class="plate"' in html, page
          css = Path('frontend/assets/plate-runtime.css').read_text(encoding='utf-8')
          expected = {
              'home': 'home.jpg',
              'catalog': 'catalog.jpg',
              'library': 'library.jpg',
              'retro': 'retro.jpg',
              'pc': 'pc.jpg',
              'achievements': 'achievements.jpg',
              'account': 'account.jpg',
              'admin': 'admin.jpg',
          }
          for page, filename in expected.items():
              assert f'body[data-page="{page}"]' in css
              assert filename in css
          assert 'storcloud-plates.avif' not in css
          print('8 approved pixel plates wired directly and validated')
          PY
