name: Web CI

on:
  push:
    branches: [main]
    paths:
      - 'frontend/**'
      - 'update.sh'
      - '.github/workflows/web-ci.yml'
  pull_request:
    paths:
      - 'frontend/**'
      - 'update.sh'
      - '.github/workflows/web-ci.yml'

jobs:
  web-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate Nginx configuration
        run: |
          docker run --rm \
            -v "$PWD/frontend/nginx.conf:/etc/nginx/conf.d/default.conf:ro" \
            nginx:1.27-alpine nginx -t
      - name: Validate console base assets
        run: |
          test -f frontend/assets/console.css
          test -f frontend/assets/spatial-nav.js
          test -d frontend/assets/art
          test -f frontend/assets/art/home-scene.svg
          test -f frontend/assets/art/account-scene.svg
          test -f frontend/assets/art/pc-scene.svg
          test -f frontend/assets/art/achievements-scene.svg
          grep -q 'resolver 127.0.0.11' frontend/nginx.conf
      - name: Validate console pages and JavaScript syntax
        run: |
          node --check frontend/assets/spatial-nav.js
          python3 - <<'PY'
          from pathlib import Path
          import re, subprocess
          pages = [
              Path('frontend/index.html'),
              Path('frontend/catalog/index.html'),
              Path('frontend/library/index.html'),
              Path('frontend/retro/index.html'),
              Path('frontend/pc/index.html'),
              Path('frontend/achievements/index.html'),
              Path('frontend/account/index.html'),
              Path('frontend/admin/index.html'),
          ]
          pattern = re.compile(r'<script(?P<attrs>[^>]*)>(?P<code>.*?)</script>', flags=re.S | re.I)
          for page in pages:
              if not page.is_file():
                  raise SystemExit(f'missing page: {page}')
              html = page.read_text(encoding='utf-8')
              if '/assets/console.css' not in html:
                  raise SystemExit(f'{page}: console.css not loaded')
              scripts = list(pattern.finditer(html))
              if not scripts:
                  raise SystemExit(f'{page}: no JavaScript found')
              for index, block in enumerate(scripts):
                  code = block.group('code')
                  if not code.strip():
                      continue
                  attrs = block.group('attrs').lower()
                  is_module = 'type="module"' in attrs or "type='module'" in attrs
                  target = Path('/tmp') / f'{page.parent.name or "home"}-{index}.{"mjs" if is_module else "js"}'
                  target.write_text(code, encoding='utf-8')
                  subprocess.run(['node', '--check', str(target)], check=True)
                  print('OK', page, index)
          PY
