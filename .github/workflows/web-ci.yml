name: Web CI

on:
  push:
    branches: [main]
    paths:
      - 'frontend/**'
      - 'update.sh'
      - '.github/workflows/web-ci.yml'
  pull_request:
    paths:
      - 'frontend/**'
      - 'update.sh'
      - '.github/workflows/web-ci.yml'

jobs:
  web-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate Nginx configuration
        run: |
          docker run --rm -v "$PWD/frontend/nginx.conf:/etc/nginx/conf.d/default.conf:ro" nginx:1.27-alpine nginx -t
      - name: Validate console base assets
        run: |
          test -f frontend/assets/console.css
          test -f frontend/assets/spatial-nav.js
          test -f frontend/assets/art/home-scene.svg
          grep -q 'data:image/webp;base64' frontend/assets/art/home-scene.svg
          grep -q 'mock-hero' frontend/index.html
      - name: Validate console pages and JavaScript syntax
        run: |
          node --check frontend/assets/spatial-nav.js
          python3 - <<'PY'
          from pathlib import Path
          import re, subprocess
          pages = [
              Path('frontend/index.html'), Path('frontend/catalog/index.html'), Path('frontend/library/index.html'),
              Path('frontend/retro/index.html'), Path('frontend/pc/index.html'), Path('frontend/achievements/index.html'),
              Path('frontend/account/index.html'), Path('frontend/admin/index.html'),
          ]
          for page in pages:
              if not page.exists():
                  raise SystemExit(f'missing page: {page}')
              html = page.read_text(encoding='utf-8')
              blocks = re.findall(r'<script(?:\s[^>]*)?>(.*?)</script>', html, flags=re.S | re.I)
              for index, code in enumerate(blocks):
                  if not code.strip():
                      continue
                  code = re.sub(r'^\s*import\s+.+?;\s*$', '', code, flags=re.M)
                  target = Path('/tmp') / f'{page.parent.name or "home"}-{index}.js'
                  target.write_text(code, encoding='utf-8')
                  subprocess.run(['node', '--check', str(target)], check=True)
          PY
