name: Web CI

on:
  push:
    branches: [main]
    paths:
      - 'frontend/**'
      - 'update.sh'
      - '.github/workflows/web-ci.yml'
  pull_request:
    paths:
      - 'frontend/**'
      - 'update.sh'
      - '.github/workflows/web-ci.yml'

jobs:
  web-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate Nginx configuration
        run: |
          docker run --rm \
            -v "$PWD/frontend/nginx.conf:/etc/nginx/conf.d/default.conf:ro" \
            nginx:1.27-alpine nginx -t
      - name: Validate required launcher files
        run: |
          test -f frontend/index.html
          test -f frontend/catalog/index.html
          test -f frontend/library/index.html
          test -f frontend/assets/storcloud.css
          grep -q '/api/healthz' frontend/index.html
          grep -q 'resolver 127.0.0.11' frontend/nginx.conf
          grep -q '8080/api/healthz' update.sh
