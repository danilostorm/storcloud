name: Web CI

on:
  push:
    branches: [main, pixel-plates-release]
    paths:
      - 'frontend/**'
      - 'update.sh'
      - '.github/workflows/web-ci.yml'
  pull_request:
    paths:
      - 'frontend/**'
      - 'update.sh'
      - '.github/workflows/web-ci.yml'

jobs:
  web-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate Nginx configuration
        run: |
          docker run --rm -v "$PWD/frontend/nginx.conf:/etc/nginx/conf.d/default.conf:ro" nginx:1.27-alpine nginx -t
      - name: Validate approved pixel plates
        run: |
          test -s frontend/assets/mockups/home.jpg
          test -s frontend/assets/mockups/catalog.jpg
          test -s frontend/assets/mockups/library.jpg
          test -s frontend/assets/mockups/retro.jpg
          test -s frontend/assets/mockups/pc.jpg
          test -s frontend/assets/mockups/achievements.jpg
          test -s frontend/assets/mockups/account.jpg
          test -s frontend/assets/mockups/admin.jpg
          file frontend/assets/mockups/*.jpg | tee /tmp/plates.txt
          test "$(grep -c 'JPEG image data' /tmp/plates.txt)" -eq 8
      - name: Validate pixel UI files
        run: |
          test -s frontend/assets/pixel.css
          node --check frontend/assets/pixel.js
          python3 - <<'PY'
          from pathlib import Path
          pages = {
              Path('frontend/index.html'): 'home.jpg',
              Path('frontend/catalog/index.html'): 'catalog.jpg',
              Path('frontend/library/index.html'): 'library.jpg',
              Path('frontend/retro/index.html'): 'retro.jpg',
              Path('frontend/pc/index.html'): 'pc.jpg',
              Path('frontend/achievements/index.html'): 'achievements.jpg',
              Path('frontend/account/index.html'): 'account.jpg',
              Path('frontend/admin/index.html'): 'admin.jpg',
          }
          for page, plate in pages.items():
              html = page.read_text(encoding='utf-8')
              assert '/assets/pixel.css' in html, page
              assert '/assets/pixel.js' in html, page
              assert f'/assets/mockups/{plate}' in html, page
              assert 'id="live"' in html, page
          PY
