name: Web CI

on:
  push:
    branches: [main]
    paths:
      - 'frontend/**'
      - 'update.sh'
      - '.github/workflows/web-ci.yml'
  pull_request:
    paths:
      - 'frontend/**'
      - 'update.sh'
      - '.github/workflows/web-ci.yml'

jobs:
  web-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate Nginx configuration
        run: |
          docker run --rm \
            -v "$PWD/frontend/nginx.conf:/etc/nginx/conf.d/default.conf:ro" \
            nginx:1.27-alpine nginx -t
      - name: Validate approved console assets and pages
        run: |
          python3 - <<'PY'
          from pathlib import Path
          required = [
              'frontend/index.html',
              'frontend/catalog/index.html',
              'frontend/library/index.html',
              'frontend/retro/index.html',
              'frontend/pc/index.html',
              'frontend/achievements/index.html',
              'frontend/account/index.html',
              'frontend/admin/index.html',
              'frontend/assets/console.css',
              'frontend/assets/spatial-nav.js',
              'frontend/assets/art/home-scene.svg',
              'frontend/assets/art/account-scene.svg',
              'frontend/assets/art/pc-scene.svg',
              'frontend/assets/art/achievements-scene.svg',
          ]
          for name in required:
              p = Path(name)
              if not p.is_file():
                  raise SystemExit(f'missing required UI file: {name}')
              print('OK', name)
          checks = {
              'frontend/index.html': ['healthz', 'controller-bar'],
              'frontend/account/index.html': ['detailText', 'reg-pass2'],
              'frontend/library/index.html': ['scanAll', 'platformMenu'],
              'frontend/retro/index.html': ['player-menu', 'Nostalgist'],
              'frontend/nginx.conf': ['resolver 127.0.0.11'],
              'update.sh': ['8080/api/healthz'],
          }
          for name, needles in checks.items():
              text = Path(name).read_text(encoding='utf-8')
              for needle in needles:
                  if needle not in text:
                      raise SystemExit(f'{name}: missing marker {needle!r}')
                  print('OK marker', name, needle)
          PY
      - name: Validate console JavaScript syntax
        run: |
          node --check frontend/assets/spatial-nav.js
          python3 - <<'PY'
          from pathlib import Path
          import re, subprocess
          pages = [
              Path('frontend/index.html'),
              Path('frontend/catalog/index.html'),
              Path('frontend/library/index.html'),
              Path('frontend/retro/index.html'),
              Path('frontend/pc/index.html'),
              Path('frontend/achievements/index.html'),
              Path('frontend/account/index.html'),
              Path('frontend/admin/index.html'),
          ]
          pattern = re.compile(r'<script(?P<attrs>[^>]*)>(?P<code>.*?)</script>', flags=re.S | re.I)
          for page in pages:
              html = page.read_text(encoding='utf-8')
              for index, block in enumerate(pattern.finditer(html)):
                  code = block.group('code')
                  if not code.strip():
                      continue
                  attrs = block.group('attrs').lower()
                  is_module = 'type="module"' in attrs or "type='module'" in attrs
                  target = Path('/tmp') / f'{page.parent.name or "home"}-{index}.{"mjs" if is_module else "js"}'
                  target.write_text(code, encoding='utf-8')
                  subprocess.run(['node', '--check', str(target)], check=True)
                  print('OK JS', page, index)
          PY
