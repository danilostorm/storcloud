name: Server CI

on:
  push:
    branches: [main]
    paths:
      - 'backend/api/**'
      - 'docker-compose.yml'
      - 'scripts/bootstrap-env.sh'
      - '.github/workflows/server-ci.yml'
  pull_request:
    paths:
      - 'backend/api/**'
      - 'docker-compose.yml'
      - 'scripts/bootstrap-env.sh'
      - '.github/workflows/server-ci.yml'

jobs:
  api-smoke:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: storcloud
          POSTGRES_USER: storcloud
          POSTGRES_PASSWORD: storcloud-ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U storcloud -d storcloud"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    env:
      DATABASE_URL: postgresql+psycopg://storcloud:storcloud-ci@127.0.0.1:5432/storcloud
      STORCLOUD_SETUP_TOKEN: ci-setup-token
      STORCLOUD_COOKIE_SECURE: 'false'
      STORCLOUD_SAVE_ROOT: ${{ github.workspace }}/.tmp-saves
      STORCLOUD_ROM_ROOT: ${{ github.workspace }}/.tmp-roms
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/api/requirements.txt
      - name: Install API dependencies
        working-directory: backend/api
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest httpx
      - name: Compile API
        working-directory: backend/api
        run: python -m compileall -q .
      - name: Run control-plane smoke test
        working-directory: backend/api
        run: pytest -q test_smoke.py
