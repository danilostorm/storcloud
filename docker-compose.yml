services:
  api:
    build:
      context: ./backend/api
    container_name: storcloud-api
    restart: unless-stopped
    ports:
      - "8000:8000"
    volumes:
      - ./runtime:/runtime:ro

  web:
    image: nginx:1.27-alpine
    container_name: storcloud-web
    restart: unless-stopped
    depends_on:
      - api
    ports:
      - "8080:80"
    volumes:
      - ./frontend/index.html:/usr/share/nginx/html/index.html:ro
      - ./frontend/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./runtime/games:/usr/share/nginx/html/games:ro
