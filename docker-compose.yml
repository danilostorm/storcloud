services:
  db:
    image: postgres:17-alpine
    container_name: storcloud-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: storcloud
      POSTGRES_USER: storcloud
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U storcloud -d storcloud"]
      interval: 5s
      timeout: 3s
      retries: 20
    volumes:
      - storcloud-postgres:/var/lib/postgresql/data

  api:
    build:
      context: ./backend/api
    container_name: storcloud-api
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+psycopg://storcloud:${POSTGRES_PASSWORD}@db:5432/storcloud
      STORCLOUD_SETUP_TOKEN: ${STORCLOUD_SETUP_TOKEN}
      STORCLOUD_SESSION_DAYS: ${STORCLOUD_SESSION_DAYS:-30}
      STORCLOUD_ALLOW_REGISTRATION: ${STORCLOUD_ALLOW_REGISTRATION:-true}
      STORCLOUD_COOKIE_SECURE: ${STORCLOUD_COOKIE_SECURE:-false}
      STORCLOUD_SAVE_ROOT: /storage/saves
      STORCLOUD_ROM_ROOT: /storage/roms
      STORCLOUD_MAX_ROM_BYTES: ${STORCLOUD_MAX_ROM_BYTES:-2147483648}
      STORCLOUD_CATALOG_PATH: /catalog/games.json
      STORCLOUD_STREAMING_ENABLED: ${STORCLOUD_STREAMING_ENABLED:-false}
      STORCLOUD_STREAMING_PROVIDER: ${STORCLOUD_STREAMING_PROVIDER:-sunshine}
      STORCLOUD_STREAMING_HOST: ${STORCLOUD_STREAMING_HOST:-}
      STORCLOUD_STREAMING_GATEWAY_TEMPLATE: ${STORCLOUD_STREAMING_GATEWAY_TEMPLATE:-}
    ports:
      - "8000:8000"
    volumes:
      - ./runtime:/runtime:ro
      - ./storage:/storage
      - ./catalog:/catalog:ro

  web:
    image: nginx:1.27-alpine
    container_name: storcloud-web
    restart: unless-stopped
    depends_on:
      - api
    ports:
      - "8080:80"
    volumes:
      - ./frontend:/srv/storcloud/frontend:ro
      - ./runtime/games:/srv/storcloud/games:ro
      - ./frontend/nginx.conf:/etc/nginx/conf.d/default.conf:ro

volumes:
  storcloud-postgres:
