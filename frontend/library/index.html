<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>StorCloud · Minha Biblioteca</title>
  <link rel="stylesheet" href="/assets/storcloud.css">
</head>
<body>
<div class="app-shell">
  <aside class="sidebar">
    <a class="brand-mark" href="/">S</a>
    <nav class="side-nav">
      <a class="side-link" href="/"><span class="ico">⌂</span><span>Início</span></a>
      <a class="side-link" href="/catalog/"><span class="ico">◫</span><span>Explorar</span></a>
      <a class="side-link active" href="/library/"><span class="ico">▦</span><span>Biblioteca</span></a>
      <a class="side-link" href="/pc/"><span class="ico">▣</span><span>PC</span></a>
      <a class="side-link" href="/achievements/"><span class="ico">◆</span><span>Conquistas</span></a>
    </nav>
    <div class="sidebar-bottom"><a class="side-link" href="/account/"><span class="ico">●</span><span>Conta</span></a></div>
  </aside>
  <div class="content">
    <header class="topbar">
      <div class="page-title">MINHA BIBLIOTECA</div>
      <div class="searchbox"><span>⌕</span><input id="search" placeholder="Buscar na coleção"></div>
      <div class="top-spacer"></div>
      <a id="who" class="profile-link" href="/account/">Verificando conta…</a>
    </header>
    <main class="main">
      <section class="section" style="margin-top:4px">
        <div class="section-head"><div><div class="eyebrow">COLEÇÃO PESSOAL</div><h2 style="font-size:34px;margin-top:7px">Seus jogos, prontos para abrir.</h2><p>ROMs privadas por usuário, favoritos e acesso direto ao player Retro unificado.</p></div></div>
        <div id="status" class="notice">Carregando biblioteca…</div>
        <section class="upload-panel" id="uploadBox" hidden>
          <input id="title" placeholder="Título do jogo (opcional)">
          <select id="platform"><option value="">Plataforma</option></select>
          <input id="rom" type="file">
          <button id="upload" class="btn">＋ Adicionar</button>
        </section>
        <div class="filterbar">
          <button id="allBtn" class="filter active">Todos</button>
          <button id="favBtn" class="filter">★ Favoritos</button>
          <button id="refresh" class="filter">↻ Atualizar</button>
        </div>
        <section id="grid" class="library-grid"></section>
      </section>
    </main>
  </div>
</div>
<script>
const api='/api',$=id=>document.getElementById(id);let roms=[],platforms=[],onlyFav=false;
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function msg(t,c=''){const e=$('status');e.className='notice '+c;e.textContent=t}
async function req(path,options={}){const r=await fetch(api+path,options);let d={};try{d=await r.json()}catch{}if(!r.ok)throw new Error(d.detail||`HTTP ${r.status}`);return d}
function coverClass(id){return id==='gba'||id==='gb'?'linear-gradient(145deg,#0b6f65,#36c980)':id==='snes'?'linear-gradient(145deg,#263b78,#7655cc)':id==='genesis'?'linear-gradient(145deg,#1d293e,#e2385d)':id==='n64'?'linear-gradient(145deg,#1e5f35,#e9b52d)':id==='ps1'?'linear-gradient(145deg,#4d5361,#1b1f27)':'linear-gradient(145deg,#1e2e6a,#5a3eb0 56%,#e24f8f)'}
async function boot(){try{const me=await req('/auth/me');$('who').textContent=me.user.username;$('uploadBox').hidden=false;platforms=(await req('/retro/platforms')).items;$('platform').innerHTML='<option value="">Plataforma</option>'+platforms.map(p=>`<option value="${p.id}">${p.short} · ${p.name}</option>`).join('');await load()}catch(e){$('who').textContent='Entrar';msg('Entre na sua conta para acessar a biblioteca.','err');$('grid').innerHTML='<div class="empty-state">Sua biblioteca é privada e exige login.</div>'}}
async function load(){const d=await req('/library/roms');roms=d.items;render();msg(`${d.count} jogo(s) na sua coleção.`,'ok')}
function render(){const q=$('search').value.trim().toLowerCase();const list=roms.filter(r=>(!onlyFav||r.favorite)&&(!q||(r.title+' '+r.platform_id).toLowerCase().includes(q)));$('grid').innerHTML=list.length?list.map(r=>{const p=platforms.find(p=>p.id===r.platform_id);return `<article class="library-card"><div class="cover-art" style="background:${coverClass(r.platform_id)}"><div class="cover-code">${esc((p?.short||r.platform_id).toUpperCase())}</div></div><div class="library-body"><h3>${esc(r.title)}</h3><div class="meta">${esc(p?.name||r.platform_id)} · ${(r.size_bytes/1024/1024).toFixed(2)} MB${r.last_played_at?'<br>Último jogo: '+new Date(r.last_played_at).toLocaleDateString():''}</div></div><div class="library-actions"><a class="btn" href="/retro/?rom=${r.id}">▶ Jogar</a><button class="btn ghost" onclick="favorite('${r.id}',${!r.favorite})">${r.favorite?'★':'☆'}</button><button class="btn danger" onclick="removeRom('${r.id}')">×</button></div></article>`}).join(''):'<div class="empty-state">Nenhum jogo neste filtro. Adicione uma ROM própria acima.</div>'}
$('upload').onclick=async()=>{const f=$('rom').files?.[0],p=$('platform').value;if(!f||!p){msg('Escolha plataforma e arquivo.','err');return}const form=new FormData();form.append('platform_id',p);form.append('title',$('title').value);form.append('file',f,f.name);try{msg('Enviando jogo para sua biblioteca…');const r=await fetch(api+'/library/roms',{method:'POST',body:form});let d={};try{d=await r.json()}catch{}if(!r.ok)throw new Error(d.detail||`HTTP ${r.status}`);$('rom').value='';$('title').value='';await load()}catch(e){msg('Falha no upload: '+e.message,'err')}};
window.favorite=async(id,value)=>{try{await req(`/library/roms/${id}/favorite?value=${value}`,{method:'PUT'});await load()}catch(e){msg(e.message,'err')}};window.removeRom=async id=>{if(!confirm('Excluir este jogo da sua biblioteca?'))return;try{await req('/library/roms/'+id,{method:'DELETE'});await load()}catch(e){msg(e.message,'err')}};
$('search').oninput=render;$('allBtn').onclick=()=>{onlyFav=false;$('allBtn').classList.add('active');$('favBtn').classList.remove('active');render()};$('favBtn').onclick=()=>{onlyFav=true;$('favBtn').classList.add('active');$('allBtn').classList.remove('active');render()};$('refresh').onclick=()=>load().catch(e=>msg(e.message,'err'));boot();
</script>
</body></html>
