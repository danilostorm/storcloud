<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>StorCloud Conquistas</title><style>:root{color-scheme:dark;font-family:Inter,system-ui,sans-serif;background:#070a12;color:#f7f8ff}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(circle at 20% 0,#2a2457 0,#070a12 48%)}header{height:70px;padding:0 5vw;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid #ffffff14}.brand{font-weight:900}.back{color:#c2c9ff;text-decoration:none}main{max-width:1200px;margin:auto;padding:46px 5vw 70px}h1{font-size:clamp(2.8rem,7vw,5.4rem);line-height:.95;margin:.1em 0}.muted{color:#9aa4be;line-height:1.65}.progress{margin:24px 0;padding:16px 18px;border:1px solid #ffffff14;background:#ffffff08;border-radius:15px}.bar{height:10px;background:#ffffff10;border-radius:99px;overflow:hidden;margin-top:10px}.bar span{display:block;height:100%;background:linear-gradient(90deg,#6675ff,#8c6dff)}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:16px}.card{padding:20px;border:1px solid #ffffff14;background:linear-gradient(145deg,#14192a,#0d101a);border-radius:18px;opacity:.45}.card.unlocked{opacity:1;box-shadow:0 18px 50px #0005}.icon{font-size:2rem}.card h2{margin:10px 0 6px}.badge{display:inline-block;margin-top:12px;padding:5px 8px;border-radius:999px;border:1px solid #ffffff16;background:#ffffff09;font-size:.72rem}.ok{color:#78f3b9}.warn{color:#ffd27a}.status{margin:18px 0}</style></head><body><header><div class="brand">StorCloud · Conquistas</div><div><a class="back" href="/account/">Conta</a> · <a class="back" href="/">Início</a></div></header><main><h1>Seu progresso.</h1><p class="muted">Conquistas são liberadas automaticamente pelo uso real da plataforma: sessões, playtime, biblioteca e dispositivos pareados.</p><div id="status" class="status">Carregando…</div><div id="progress" class="progress" hidden><b id="progressText"></b><div class="bar"><span id="bar"></span></div></div><section id="grid" class="grid"></section></main><script>const $=id=>document.getElementById(id);const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));async function load(){const r=await fetch('/api/achievements');if(r.status===401){$('status').innerHTML='<span class="warn">Entre na sua conta para ver conquistas.</span>';return}if(!r.ok){$('status').textContent='Falha ao carregar conquistas.';return}const d=await r.json();$('status').innerHTML='<span class="ok">Conquistas sincronizadas com sua conta.</span>';$('progress').hidden=false;$('progressText').textContent=`${d.unlocked} de ${d.total} desbloqueadas`;$('bar').style.width=`${d.total?Math.round(d.unlocked/d.total*100):0}%`;$('grid').innerHTML=d.items.map(x=>`<article class="card ${x.unlocked?'unlocked':''}"><div class="icon">${esc(x.icon)}</div><h2>${esc(x.title)}</h2><p class="muted">${esc(x.description)}</p><span class="badge ${x.unlocked?'ok':''}">${x.unlocked?'Desbloqueada':'Bloqueada'}</span>${x.unlocked_at?`<div class="muted" style="margin-top:8px;font-size:.78rem">${new Date(x.unlocked_at).toLocaleString()}</div>`:''}</article>`).join('')}load();</script></body></html>
