<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>StorCloud · Conquistas</title><link rel="stylesheet" href="/assets/console.css"><style>.achievement{flex:0 0 clamp(230px,18vw,300px);border:1px solid #ffffff18;background:#080c17bb;border-radius:20px;padding:20px;opacity:.45;min-height:220px}.achievement.unlocked{opacity:1}.achievement .icon{font-size:36px}.achievement h3{margin:14px 0 7px}.progress{height:8px;background:#ffffff13;border-radius:99px;overflow:hidden;margin-top:10px}.progress span{display:block;height:100%;background:#fff}</style></head><body class="console"><div class="console-bg"></div><header class="console-top"><a class="console-brand" href="/">StorCloud Play</a><nav class="console-nav"><a href="/">Jogos</a><a href="/catalog/">Explorar</a><a href="/library/">Retro</a><a href="/pc/">PC Local</a><a class="active" href="/achievements/">Conquistas</a></nav><div class="console-actions"><a class="console-user" href="/account/">Conta</a></div></header><main class="console-main"><section class="console-hero" style="min-height:310px"><div class="console-hero-copy"><div class="console-kicker">PLAYER PROGRESS</div><h1 style="font-size:clamp(44px,5vw,76px)">Seu progresso.</h1><p>Conquistas são liberadas pelo uso real do StorCloud: jogar, acumular horas, montar biblioteca e parear dispositivos.</p><div id="progressBox" class="console-panel" style="max-width:430px" hidden><b id="progressText">0 / 0</b><div class="progress"><span id="bar"></span></div></div></div></section><div id="status" class="console-notice">Carregando conquistas…</div><section class="rail-section"><div class="rail-head"><div><h2>Conquistas</h2><p>Use direcional ou controle para navegar.</p></div></div><div id="rail" class="rail"></div></section></main><script>
const $=id=>document.getElementById(id),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));async function load(){const r=await fetch('/api/achievements');if(r.status===401){$('status').textContent='Entre na conta para ver suas conquistas.';$('status').className='console-notice err';return}if(!r.ok){$('status').textContent='Falha ao carregar conquistas.';return}const d=await r.json();$('status').textContent='Conquistas sincronizadas com sua conta.';$('status').className='console-notice ok';$('progressBox').hidden=false;$('progressText').textContent=`${d.unlocked} de ${d.total} desbloqueadas`;$('bar').style.width=`${d.total?Math.round(d.unlocked/d.total*100):0}%`;$('rail').innerHTML=d.items.map(x=>`<article tabindex="0" class="achievement ${x.unlocked?'unlocked':''}"><div class="icon">${esc(x.icon)}</div><h3>${esc(x.title)}</h3><p class="muted">${esc(x.description)}</p><span class="console-chip ${x.unlocked?'ok':''}">${x.unlocked?'Desbloqueada':'Bloqueada'}</span></article>`).join('')}load();
</script><script src="/assets/spatial-nav.js"></script></body></html>
