<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>StorCloud · Admin</title><link rel="stylesheet" href="/assets/console.css"><style>.ops{display:grid;grid-template-columns:minmax(0,1.35fr) minmax(300px,.65fr);gap:16px}.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px}.stat{border:1px solid #ffffff16;background:#080c17bb;border-radius:17px;padding:16px}.stat b{font-size:24px;display:block}.stat small{color:#9ca6ba}.table{width:100%;border-collapse:collapse;font-size:12px}.table th,.table td{padding:10px;border-bottom:1px solid #ffffff10;text-align:left}.table th{color:#8f9aaf}.activity{max-height:620px;overflow:auto}.event{padding:12px 0;border-bottom:1px solid #ffffff10}@media(max-width:950px){.ops{grid-template-columns:1fr}.table{display:block;overflow:auto}}</style></head><body class="console"><div class="console-bg"></div><header class="console-top"><a class="console-brand" href="/">StorCloud Play</a><nav class="console-nav"><a href="/">Jogos</a><a href="/catalog/">Explorar</a><a href="/library/">Retro</a><a href="/pc/">PC Local</a><a class="active" href="/admin/">Admin</a></nav><div class="console-actions"><a class="console-user" href="/account/">Conta</a></div></header><main class="console-main"><section class="console-hero" style="min-height:260px"><div class="console-hero-copy"><div class="console-kicker">OPERATIONS CENTER</div><h1 style="font-size:clamp(42px,5vw,72px)">Controle da plataforma.</h1><p>Usuários, dispositivos, biblioteca, saves e playtime da sua instância.</p></div></section><div id="status" class="console-notice">Validando acesso administrativo…</div><section id="content" hidden><div id="stats" class="stats"></div><div class="ops" style="margin-top:16px"><article class="console-panel"><h2>Jogadores</h2><div style="overflow:auto"><table class="table"><thead><tr><th>Usuário</th><th>Função</th><th>Status</th><th>ROMs</th><th>PCs</th><th>Playtime</th><th>Ações</th></tr></thead><tbody id="users"></tbody></table></div></article><article class="console-panel activity"><h2>Atividade recente</h2><div id="activity"></div></article></div></section></main><script>
const $=id=>document.getElementById(id),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));async function api(path,opt={}){const r=await fetch('/api'+path,{headers:{'Content-Type':'application/json',...(opt.headers||{})},...opt});let d={};try{d=await r.json()}catch{}if(!r.ok)throw Error(d.detail||`HTTP ${r.status}`);return d}function fmt(sec){sec=Number(sec||0);const h=Math.floor(sec/3600),m=Math.floor((sec%3600)/60);return h?`${h}h ${m}m`:`${m}m`}async function load(){try{const me=(await api('/auth/me')).user;if(me.role!=='admin')throw Error('Acesso de administrador necessário.');const [ov,u,a]=await Promise.all([api('/admin/overview'),api('/admin/users/detail'),api('/admin/activity')]);$('status').textContent=`Administrador: ${me.username}`;$('status').className='console-notice ok';$('content').hidden=false;$('stats').innerHTML=[['Usuários',ov.users],['Ativos',ov.active_users],['PCs',ov.devices],['ROMs',ov.roms],['Saves',ov.saves],['Sessões',ov.sessions],['Playtime',ov.play_hours+'h']].map(x=>`<div class="stat"><b>${x[1]}</b><small>${x[0]}</small></div>`).join('');$('users').innerHTML=u.items.map(x=>`<tr><td><b>${esc(x.username)}</b><br><small>${esc(x.email||'')}</small></td><td>${x.role}</td><td>${x.active?'ativo':'bloqueado'}</td><td>${x.roms}</td><td>${x.devices}</td><td>${fmt(x.play_seconds)}</td><td><button class="mini-btn" onclick="role(${x.id},'${x.role==='admin'?'user':'admin'}')">${x.role==='admin'?'Rebaixar':'Admin'}</button><button class="mini-btn danger" onclick="statusUser(${x.id},${!x.active})">${x.active?'Bloquear':'Ativar'}</button></td></tr>`).join('');$('activity').innerHTML=a.items.length?a.items.map(x=>`<div class="event"><b>${esc(x.title)}</b><div class="muted" style="font-size:12px">${esc(x.username)} · ${esc(x.mode)}${x.platform_id?' · '+esc(x.platform_id):''}<br>${fmt(x.duration_seconds)} · ${new Date(x.last_seen_at).toLocaleString()}</div></div>`).join(''):'<span class="muted">Nenhuma atividade.</span>'}catch(e){$('status').textContent=e.message;$('status').className='console-notice err'}}window.role=async(id,role)=>{try{await api(`/admin/users/${id}/role`,{method:'PUT',body:JSON.stringify({role})});await load()}catch(e){alert(e.message)}};window.statusUser=async(id,active)=>{try{await api(`/admin/users/${id}/status`,{method:'PUT',body:JSON.stringify({active})});await load()}catch(e){alert(e.message)}};load();
</script><script src="/assets/spatial-nav.js"></script></body></html>
