<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>StorCloud Admin</title>
<style>:root{color-scheme:dark;font-family:Inter,system-ui,sans-serif;background:#070a12;color:#f7f8ff}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(circle at 15% 0,#242c62 0,#070a12 48%)}header{height:70px;padding:0 5vw;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid #ffffff14}.brand{font-weight:900}.back{color:#c1c9ff;text-decoration:none}main{max-width:1450px;margin:auto;padding:40px 5vw 70px}h1{font-size:clamp(2.6rem,6vw,5rem);margin:.1em 0}.muted{color:#98a2bd;line-height:1.6}.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin:28px 0}.stat,.panel{border:1px solid #ffffff14;background:#111728;border-radius:18px;padding:18px}.stat b{display:block;font-size:1.8rem}.stat small{color:#909ab6}.grid{display:grid;grid-template-columns:minmax(0,1.2fr) minmax(320px,.8fr);gap:18px}.panel h2{margin-top:0}.table{width:100%;border-collapse:collapse;font-size:.88rem}.table th,.table td{text-align:left;padding:10px;border-bottom:1px solid #ffffff0f;vertical-align:middle}.table th{color:#8e98b5}.btn{border:0;border-radius:9px;padding:8px 10px;background:#6675ff;color:white;font-weight:800;cursor:pointer;margin:2px}.btn.secondary{background:#ffffff0e;border:1px solid #ffffff18}.btn.danger{background:#9e3a52}.badge{display:inline-block;padding:4px 7px;border-radius:999px;border:1px solid #ffffff16;background:#ffffff0a;font-size:.7rem}.ok{color:#7cf3bc}.warn{color:#ffd275}.err{color:#ff9c9c}.activity{max-height:650px;overflow:auto}.event{padding:12px 0;border-bottom:1px solid #ffffff0f}.event b{display:block}.status{margin:18px 0;padding:12px 14px;border:1px solid #ffffff14;background:#ffffff08;border-radius:12px}@media(max-width:980px){.grid{grid-template-columns:1fr}.table{display:block;overflow:auto}}</style></head>
<body><header><div class="brand">StorCloud · Admin</div><div><a class="back" href="/account/">Conta</a> · <a class="back" href="/">Início</a></div></header><main>
<section><h1>Controle da plataforma.</h1><p class="muted">Usuários, biblioteca, dispositivos, playtime e atividade em um só lugar.</p></section><div id="status" class="status">Validando acesso administrativo…</div>
<section id="content" hidden><div id="stats" class="stats"></div><div class="grid"><article class="panel"><h2>Usuários</h2><div style="overflow:auto"><table class="table"><thead><tr><th>Usuário</th><th>Role</th><th>Status</th><th>ROMs</th><th>PCs</th><th>Playtime</th><th>Ações</th></tr></thead><tbody id="users"></tbody></table></div></article><article class="panel activity"><h2>Atividade recente</h2><div id="activity"></div></article></div></section>
</main><script>
const $=id=>document.getElementById(id);const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));async function api(path,opt={}){const r=await fetch('/api'+path,{headers:{'Content-Type':'application/json',...(opt.headers||{})},...opt});let d={};try{d=await r.json()}catch{}if(!r.ok)throw new Error(d.detail||`HTTP ${r.status}`);return d}function fmt(sec){sec=Number(sec||0);const h=Math.floor(sec/3600),m=Math.floor((sec%3600)/60);return h?`${h}h ${m}m`:`${m}m`}async function load(){try{const me=(await api('/auth/me')).user;if(me.role!=='admin')throw new Error('Acesso de administrador necessário.');const [ov,u,a]=await Promise.all([api('/admin/overview'),api('/admin/users/detail'),api('/admin/activity')]);$('status').textContent=`Administrador: ${me.username}`;$('status').className='status ok';$('content').hidden=false;$('stats').innerHTML=[['Usuários',ov.users],['Ativos',ov.active_users],['PCs',ov.devices],['ROMs',ov.roms],['Saves',ov.saves],['Sessões',ov.sessions],['Playtime',ov.play_hours+'h']].map(x=>`<div class="stat"><b>${x[1]}</b><small>${x[0]}</small></div>`).join('');$('users').innerHTML=u.items.map(x=>`<tr><td><b>${esc(x.username)}</b><br><small>${esc(x.email||'')}</small></td><td><span class="badge">${x.role}</span></td><td class="${x.active?'ok':'err'}">${x.active?'ativo':'bloqueado'}</td><td>${x.roms}</td><td>${x.devices}</td><td>${fmt(x.play_seconds)}</td><td><button class="btn secondary" onclick="role(${x.id},'${x.role==='admin'?'user':'admin'}')">${x.role==='admin'?'Rebaixar':'Admin'}</button><button class="btn ${x.active?'danger':'secondary'}" onclick="statusUser(${x.id},${!x.active})">${x.active?'Bloquear':'Ativar'}</button></td></tr>`).join('');$('activity').innerHTML=a.items.length?a.items.map(x=>`<div class="event"><b>${esc(x.title)}</b><div class="muted">${esc(x.username)} · ${esc(x.mode)}${x.platform_id?' · '+esc(x.platform_id):''}<br>${fmt(x.duration_seconds)} · ${new Date(x.last_seen_at).toLocaleString()}</div></div>`).join(''):'<span class="muted">Nenhuma atividade registrada.</span>'}catch(e){$('status').textContent=e.message;$('status').className='status err'}}window.role=async(id,role)=>{try{await api(`/admin/users/${id}/role`,{method:'PUT',body:JSON.stringify({role})});await load()}catch(e){alert(e.message)}};window.statusUser=async(id,active)=>{try{await api(`/admin/users/${id}/status`,{method:'PUT',body:JSON.stringify({active})});await load()}catch(e){alert(e.message)}};load();
</script></body></html>
