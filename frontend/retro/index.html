<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>StorCloud · Player Retro</title><link rel="stylesheet" href="/assets/console.css"></head><body class="console"><div class="console-bg" style="background-image:url('/assets/art/home-scene.svg')"></div><header class="console-top"><a class="console-brand" href="/">◈ StorCloud Play</a><nav class="console-nav"><a href="/">Início</a><a href="/catalog/">Jogos</a><a href="/catalog/">Explorar</a><a class="active" href="/library/">Retro</a><a href="/pc/">PC Local</a><a href="/achievements/">Conquistas</a></nav><div class="console-actions"><a class="console-user" href="/library/">Biblioteca</a></div></header><main class="console-main" style="padding-top:4px"><section id="playerShell" class="player-shell"><div class="player-stage"><div id="empty" style="text-align:center;color:#7f91ac"><div style="font-size:44px;margin-bottom:10px">◈</div><b style="color:#dce7ff">Selecione um jogo</b><div style="font-size:11px;margin-top:6px">Abra pela Biblioteca Retro ou escolha uma ROM local no menu.</div></div><canvas id="gameCanvas" tabindex="-1"></canvas></div><aside class="player-menu"><div class="console-kicker">JOGO · PLAYER RETRO</div><h1 id="gameTitle">Nenhum jogo</h1><div id="gameMeta" class="muted" style="font-size:10px;margin-bottom:15px">Aguardando seleção.</div><button id="resume" disabled>▶ Continuar</button><button id="play" disabled>◉ Iniciar jogo</button><button id="save" disabled>▧ Salvar Estado</button><button id="loadState" disabled>▣ Carregar Estado</button><button id="exportState" disabled>⇩ Exportar State</button><button id="pause" disabled>Ⅱ Pausar</button><button id="controls">⌘ Controles</button><button id="fullscreen">⛶ Tela cheia</button><button id="exit" disabled>○ Sair</button><div style="margin-top:15px"><label class="muted" style="font-size:9px">ROM LOCAL</label><input id="rom" type="file" class="console-input" style="margin-top:5px;padding:9px;height:auto"><select id="platform" class="console-input" style="margin-top:6px"><option value="">Detectar plataforma</option></select><button id="clear" style="margin-top:6px" disabled>Limpar seleção</button></div></aside><div id="status" class="player-status">Player aguardando jogo.</div><input id="stateFile" type="file" hidden></section></main><footer class="controller-bar"><span class="controller-key"><b class="pad a">A</b>Selecionar</span><span class="controller-key"><b class="pad b">B</b>Voltar</span><span class="controller-key"><b class="pad x">X</b>Menu</span><span class="controller-key"><b class="pad y">Y</b>Fullscreen</span></footer><script type="module">
import { Nostalgist } from 'https://esm.sh/nostalgist@0.21.1';
const $=id=>document.getElementById(id),romInput=$('rom'),platformSelect=$('platform'),playBtn=$('play'),clearBtn=$('clear'),pauseBtn=$('pause'),resumeBtn=$('resume'),saveBtn=$('save'),loadStateBtn=$('loadState'),exportStateBtn=$('exportState'),exitBtn=$('exit');let localFile=null,emulator=null,platforms=[],libraryRom=null,playSessionId=null,playHeartbeat=null;const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const setStatus=(text,cls='')=>{$('status').className='player-status '+cls;$('status').textContent=text};const extension=name=>(name.split('.').pop()||'').toLowerCase();const selectedPlatform=()=>platforms.find(p=>p.id===platformSelect.value);const detectPlatform=f=>{const ext=extension(f.name),matches=platforms.filter(p=>p.extensions.includes(ext));return matches.length===1?matches[0]:null};function currentName(){return libraryRom?.file_name||localFile?.name||''}function currentTitle(){return libraryRom?.title||localFile?.name||'Nenhum jogo'}function currentSize(){return libraryRom?.size_bytes||localFile?.size||0}function gameKey(){if(libraryRom)return`rom-${libraryRom.id}`;if(!localFile)return'';const base=localFile.name.toLowerCase().replace(/\.[^.]+$/,'').replace(/[^a-z0-9._-]+/g,'-').replace(/^-+|-+$/g,'').slice(0,80)||'game';return`${base}-${localFile.size}`}function updateGameInfo(){const p=selectedPlatform();$('gameTitle').textContent=currentTitle();$('gameMeta').textContent=(libraryRom||localFile)?`${p?p.name:'plataforma não definida'} · ${(currentSize()/1048576).toFixed(2)} MB · ${libraryRom?'Minha Biblioteca':'Arquivo local'}`:'Aguardando seleção.';playBtn.disabled=!(libraryRom||localFile)||!p;clearBtn.disabled=!(libraryRom||localFile)}async function loadPlatforms(){const r=await fetch('/api/retro/platforms');const d=await r.json();platforms=d.items||[];platformSelect.innerHTML='<option value="">Detectar plataforma</option>'+platforms.map(p=>`<option value="${p.id}">${esc(p.short)} · ${esc(p.name)}</option>`).join('')}async function loadLibraryRomFromUrl(){const romId=new URLSearchParams(location.search).get('rom');if(!romId)return;setStatus('Carregando jogo da sua biblioteca…');const response=await fetch('/api/library/roms');if(response.status===401){setStatus('Entre na Conta para abrir este jogo.','err');return}if(!response.ok)throw Error(`biblioteca HTTP ${response.status}`);const item=(await response.json()).items?.find(r=>r.id===romId);if(!item){setStatus('Jogo não encontrado na biblioteca.','err');return}libraryRom=item;localFile=null;platformSelect.value=item.platform_id;romInput.value='';updateGameInfo();if(item.background_url){document.querySelector('.console-bg').style.backgroundImage=`linear-gradient(90deg,#02050bf3,#02050b88),url("${item.background_url}")`;document.querySelector('.console-bg').classList.add('has-image')}setStatus(`${item.title} pronto. Pressione Iniciar jogo.`,'ok')}async function startActivity(platform){await endActivity();try{const r=await fetch('/api/activity/start',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({mode:'retro-wasm',game_key:gameKey(),title:currentTitle(),platform_id:platform.id})});if(!r.ok)return;playSessionId=(await r.json()).session.id;playHeartbeat=setInterval(()=>{if(playSessionId)fetch(`/api/activity/${playSessionId}/heartbeat`,{method:'POST'}).catch(()=>{})},30000)}catch{}}async function endActivity(){if(playHeartbeat){clearInterval(playHeartbeat);playHeartbeat=null}const id=playSessionId;playSessionId=null;if(id)try{await fetch(`/api/activity/${id}/end`,{method:'POST',keepalive:true})}catch{}}romInput.onchange=()=>{libraryRom=null;localFile=romInput.files?.[0]||null;if(localFile){const p=detectPlatform(localFile);if(p)platformSelect.value=p.id}updateGameInfo()};platformSelect.onchange=updateGameInfo;clearBtn.onclick=async()=>{await endActivity();libraryRom=null;localFile=null;romInput.value='';platformSelect.value='';history.replaceState({},'',location.pathname);updateGameInfo();setStatus('Seleção limpa.')};playBtn.onclick=async()=>{const p=selectedPlatform();if((!libraryRom&&!localFile)||!p)return;playBtn.disabled=true;setStatus(`Preparando ${p.short} com ${p.core}…`);try{await endActivity();if(emulator){try{emulator.exit()}catch{}emulator=null}$('empty').style.display='none';const fileContent=libraryRom?libraryRom.file_url:localFile;emulator=await Nostalgist.prepare({element:$('gameCanvas'),core:p.core,rom:{fileName:currentName(),fileContent},cache:{core:true,rom:false,bios:true,shader:true},retroarchConfig:{rewind_enable:true,savestate_thumbnail_enable:true,video_smooth:false,menu_driver:'rgui'}});await emulator.start();if(libraryRom)fetch(`/api/library/roms/${encodeURIComponent(libraryRom.id)}/played`,{method:'POST'}).catch(()=>{});startActivity(p);setStatus(`${currentTitle()} · ${p.core} · execução local`,'ok');[pauseBtn,resumeBtn,saveBtn,loadStateBtn,exportStateBtn,exitBtn].forEach(b=>b.disabled=false);$('gameCanvas').focus()}catch(e){console.error(e);setStatus('Falha ao iniciar: '+(e?.message||e),'err');$('empty').style.display='block';playBtn.disabled=false}};pauseBtn.onclick=()=>{try{emulator?.pause();setStatus('Jogo pausado.')}catch{}};resumeBtn.onclick=()=>{try{emulator?.resume();setStatus('Jogo em execução.','ok')}catch{}};exitBtn.onclick=async()=>{await endActivity();try{emulator?.exit()}catch{}emulator=null;$('empty').style.display='block';setStatus('Sessão encerrada.');[pauseBtn,resumeBtn,saveBtn,loadStateBtn,exportStateBtn,exitBtn].forEach(b=>b.disabled=true);playBtn.disabled=!selectedPlatform()};async function captureState(){const result=await emulator.saveState(),state=result?.state||result;return state instanceof Blob?state:new Blob([state])}function downloadBlob(blob){const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=(currentTitle()||'storcloud')+'.state';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}saveBtn.onclick=async()=>{if(!emulator)return;try{const blob=await captureState(),form=new FormData();form.append('file',blob,currentTitle()+'.state');const r=await fetch(`/api/saves/${encodeURIComponent(gameKey())}/auto`,{method:'POST',body:form});if(r.status===401){downloadBlob(blob);setStatus('Sem login: state exportado localmente.');return}if(!r.ok)throw Error(`HTTP ${r.status}`);setStatus('Save sincronizado com sua conta.','ok')}catch(e){setStatus('Não foi possível salvar: '+e.message,'err')}};loadStateBtn.onclick=async()=>{if(!emulator)return;try{const r=await fetch(`/api/saves/${encodeURIComponent(gameKey())}/auto`);if(r.ok){await emulator.loadState(await r.blob());setStatus('Cloud save carregado.','ok');return}if(r.status===401||r.status===404){$('stateFile').click();return}throw Error(`HTTP ${r.status}`)}catch(e){setStatus('Falha ao carregar: '+e.message,'err')}};exportStateBtn.onclick=async()=>{if(emulator)downloadBlob(await captureState())};$('stateFile').onchange=async()=>{const s=$('stateFile').files?.[0];if(s&&emulator){await emulator.loadState(s);setStatus('State local carregado.','ok')}};$('fullscreen').onclick=async()=>{try{if(document.fullscreenElement)await document.exitFullscreen();else await $('playerShell').requestFullscreen()}catch{}};$('controls').onclick=()=>alert('Controles: use seu gamepad ou teclado mapeado pelo core RetroArch. O rewind está habilitado nos cores compatíveis.');window.addEventListener('pagehide',()=>{if(playSessionId)fetch(`/api/activity/${playSessionId}/end`,{method:'POST',keepalive:true}).catch(()=>{})});await loadPlatforms();await loadLibraryRomFromUrl();updateGameInfo();
</script><script src="/assets/spatial-nav.js"></script></body></html>
