<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>StorCloud Catálogo Híbrido</title><style>:root{color-scheme:dark;font-family:Inter,system-ui,sans-serif;background:#070a12;color:#f7f8ff}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(circle at 18% 0,#19305a 0,#070a12 48%)}header{height:70px;padding:0 5vw;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid #ffffff14}.brand{font-weight:900}.back{color:#bec7ff;text-decoration:none}main{max-width:1300px;margin:auto;padding:44px 5vw 70px}h1{font-size:clamp(2.7rem,7vw,5.4rem);line-height:.95;margin:.1em 0}.muted{color:#98a2bd;line-height:1.65}.caps{display:flex;gap:8px;flex-wrap:wrap;margin:22px 0 28px}.pill{padding:8px 10px;border:1px solid #ffffff15;background:#ffffff08;border-radius:999px;font-size:.78rem}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(270px,1fr));gap:16px}.card{padding:20px;border:1px solid #ffffff14;background:linear-gradient(145deg,#141b2d,#0d111d);border-radius:18px;display:flex;flex-direction:column;justify-content:space-between;min-height:280px}.mode{font-size:.72rem;text-transform:uppercase;letter-spacing:.12em;color:#80f2bd}.mode.none{color:#ffae85}.btn{display:block;text-align:center;text-decoration:none;margin-top:16px;padding:11px 13px;border-radius:11px;background:#6675ff;color:#fff;font-weight:800}.btn.disabled{opacity:.4;pointer-events:none}.route{margin-top:12px;padding:10px;border-radius:11px;background:#ffffff07;border:1px solid #ffffff0e;font-size:.82rem;color:#aab3cc}</style></head><body><header><div class="brand">StorCloud · Catálogo</div><a class="back" href="/">← Início</a></header><main><h1>Uma biblioteca, várias rotas.</h1><p class="muted">O StorCloud avalia o dispositivo e escolhe Browser WASM, Retro WASM, PC Local ou streaming remoto conforme a prioridade do manifest.</p><div id="caps" class="caps"><span class="pill">Detectando…</span></div><section id="grid" class="grid"></section></main><script>
const $=id=>document.getElementById(id);const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));let caps={wasm:typeof WebAssembly==='object',webgpu:!!navigator.gpu,local_agent:false,remote_stream:false};async function detect(){try{const r=await fetch('http://127.0.0.1:47831/health',{cache:'no-store'});caps.local_agent=r.ok}catch{}try{const s=await fetch('/api/streaming/status').then(r=>r.json());caps.remote_stream=!!s.configured}catch{}$('caps').innerHTML=`<span class="pill">WASM: ${caps.wasm?'sim':'não'}</span><span class="pill">WebGPU: ${caps.webgpu?'sim':'não'}</span><span class="pill">Local Agent: ${caps.local_agent?'online':'offline'}</span><span class="pill">Streaming: ${caps.remote_stream?'configurado':'desativado'}</span>`}async function load(){await detect();const data=await fetch('/api/catalog').then(r=>r.json());const cards=[];for(const game of data.items){const r=await fetch(`/api/catalog/${encodeURIComponent(game.id)}/resolve`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(caps)});const d=await r.json();const x=d.decision;cards.push(`<article class="card"><div><span class="mode ${x?'':'none'}">${x?esc(x.mode):'sem rota'}</span><h2>${esc(game.title)}</h2><p class="muted">${esc(game.description||'')}</p>${x?`<div class="route">Rota escolhida: <b>${esc(x.mode)}</b><br>Prioridade: ${x.priority}</div>`:`<div class="route">${esc(d.reason||'Nenhuma rota disponível.')}</div>`}</div><a class="btn ${x&&x.launch_url?'':'disabled'}" href="${x?.launch_url||'#'}">${x?'Abrir pela melhor rota':'Indisponível'}</a></article>`)}$('grid').innerHTML=cards.join('')}load().catch(e=>$('grid').innerHTML=`<p class="muted">Falha: ${esc(e.message)}</p>`);
</script></body></html>
