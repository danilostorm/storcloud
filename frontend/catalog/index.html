<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>StorCloud · Explorar</title><link rel="stylesheet" href="/assets/console.css"></head><body class="console"><div class="console-bg" style="background-image:url('/assets/art/home-scene.svg')"></div><header class="console-top"><a class="console-brand" href="/">◈ StorCloud Play</a><nav class="console-nav"><a href="/">Início</a><a href="/catalog/">Jogos</a><a class="active" href="/catalog/">Explorar</a><a href="/library/">Retro</a><a href="/pc/">PC Local</a><a href="/achievements/">Conquistas</a></nav><div class="console-actions"><a class="console-circle" href="#search">⌕</a><a class="console-user" href="/account/">Conta</a></div></header><main class="console-main"><section class="console-hero" style="min-height:220px"><div class="console-hero-copy"><div class="console-kicker">CATÁLOGO · EXPLORAR</div><h1 style="font-size:clamp(42px,4.8vw,72px)">Explore novos mundos.</h1><p>Descubra jogos para browser, Retro, PC local e streaming. O StorCloud escolhe a melhor rota disponível neste dispositivo.</p></div></section><div style="display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:14px"><div class="platform-pills" id="filters" style="padding:0"><button class="platform-pill active" data-filter="all">Todos</button><button class="platform-pill" data-filter="wasm">WASM</button><button class="platform-pill" data-filter="retro">Retro</button><button class="platform-pill" data-filter="pc">PC Local</button><button class="platform-pill" data-filter="stream">Streaming</button><button class="platform-pill" data-filter="ready">Prontos</button></div><input id="search" class="console-input" placeholder="Buscar jogos..." style="margin-left:auto;max-width:320px"></div><div id="caps" class="console-notice">Detectando hardware e rotas…</div><section id="grid" class="console-grid"></section></main><footer class="controller-bar"><span class="controller-key"><b class="pad a">A</b>Selecionar</span><span class="controller-key"><b class="pad b">B</b>Voltar</span><span class="controller-key"><b class="pad x">X</b>Filtros</span><span class="controller-key"><b class="pad y">Y</b>Ordenar</span></footer><script>
const api='/api',$=id=>document.getElementById(id);let games=[],decisions=new Map(),filter='all';const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));let caps={wasm:typeof WebAssembly==='object',webgpu:!!navigator.gpu,local_agent:false,remote_stream:false};const fallback={"doom-wasm":"linear-gradient(145deg,#4b180f,#c43a19,#10080b)","retro-library":"linear-gradient(145deg,#0e4ba7,#6330ad,#d23d88)","pc-local-library":"linear-gradient(145deg,#08385d,#2a2a70,#7c2088)","quake-wasm":"linear-gradient(145deg,#332c20,#16131a,#40263e)"};async function detect(){try{const r=await fetch('http://127.0.0.1:47831/health',{cache:'no-store'});caps.local_agent=r.ok}catch{}try{const s=await fetch(api+'/streaming/status',{cache:'no-store'});if(s.ok)caps.remote_stream=!!(await s.json()).configured}catch{}$('caps').innerHTML=`WASM <b>${caps.wasm?'ON':'OFF'}</b> · WebGPU <b>${caps.webgpu?'ON':'OFF'}</b> · Local Agent <b>${caps.local_agent?'ON':'OFF'}</b> · Streaming <b>${caps.remote_stream?'ON':'OFF'}</b>`}function card(g,d){const enabled=!!d,launch=d?.launch_url||'#';const type=d?.mode||g.category||'game';return `<article class="console-card"><a href="${enabled?esc(launch):'#'}" ${enabled?'':'onclick="return false"'} style="text-decoration:none"><div class="cover" style="aspect-ratio:16/9;background:${fallback[g.id]||'linear-gradient(145deg,#163f83,#5d2e9c,#c42571)'}"><div style="position:absolute;left:12px;bottom:10px;z-index:3;font-size:9px;font-weight:950;padding:4px 6px;border-radius:5px;background:#050b15b5;border:1px solid #ffffff15">${esc(type.toUpperCase())}</div></div><div class="body"><h3>${esc(g.title)}</h3><div class="meta">${esc(g.description||'')}</div></div></a><div class="actions"><a class="mini-btn ${enabled?'primary':''}" href="${enabled?esc(launch):'#'}" ${enabled?'':'onclick="return false"'}>${enabled?'▶ Jogar':'Sem rota'}</a></div></article>`}async function load(){await detect();const r=await fetch(api+'/catalog',{cache:'no-store'});if(!r.ok)throw Error('Catálogo HTTP '+r.status);const data=await r.json();games=data.items||[];await Promise.all(games.map(async g=>{const rr=await fetch(`${api}/catalog/${encodeURIComponent(g.id)}/resolve`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(caps)});if(rr.ok)decisions.set(g.id,(await rr.json()).decision||null)}));render()}function matchFilter(g,d){if(filter==='all')return true;if(filter==='ready')return!!d;if(filter==='wasm')return d?.mode?.includes('wasm')||g.routes?.some(r=>r.mode?.includes('wasm'));if(filter==='retro')return g.category==='retro'||d?.mode==='retro-wasm';if(filter==='pc')return g.category==='pc'||d?.mode==='local-native';if(filter==='stream')return d?.mode==='remote-stream'||g.routes?.some(r=>r.mode==='remote-stream');return true}function render(){const q=$('search').value.trim().toLowerCase();const list=games.filter(g=>matchFilter(g,decisions.get(g.id))&&(!q||(g.title+' '+(g.description||'')).toLowerCase().includes(q)));$('grid').innerHTML=list.length?list.map(g=>card(g,decisions.get(g.id))).join(''):'<div class="console-notice">Nenhum jogo corresponde a este filtro.</div>'}$('search').oninput=render;$('filters').onclick=e=>{const b=e.target.closest('[data-filter]');if(!b)return;filter=b.dataset.filter;document.querySelectorAll('[data-filter]').forEach(x=>x.classList.toggle('active',x===b));render()};load().catch(e=>$('grid').innerHTML=`<div class="console-notice err">Falha ao carregar catálogo: ${esc(e.message)}</div>`);
</script><script src="/assets/spatial-nav.js"></script></body></html>
